name: publish-xray-raw

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-xray-v26.3.27-r1
  cancel-in-progress: false

env:
  DISTRIBUTION_TAG: xray-v26.3.27-r1

jobs:
  prepare:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Refuse non-primary dispatches
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/xray-only
      - name: Prepare verified raw Xray member
        env:
          XRAY_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          python3 .github/scripts/prepare-xray-raw.py prepare \
            --arch "$XRAY_ARCH" --output "dist-$XRAY_ARCH"
      - name: Upload prepared architecture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-raw-${{ matrix.arch }}
          path: dist-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    # Read-only: assembling and checking the payload needs no write token.
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: xray-raw-*
          path: prepared
          merge-multiple: true
      - name: Assemble release payload
        run: |
          set -eu
          python3 .github/scripts/prepare-xray-raw.py assemble \
            --input prepared --output dist --repository-commit "$GITHUB_SHA"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Upload assembled payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-raw-dist
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    # The only job that can write: attest, then claim, fill and publish the
    # draft through publish-release.sh, which addresses it by id throughout.
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xray-raw-dist
          path: dist
      - name: Attest raw executables
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/xray-v26.3.27-linux-amd64
            dist/xray-v26.3.27-linux-arm64
      - name: Claim tag and prepare exact draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/scripts/publish-release.sh claim >"$RUNNER_TEMP/release-id"
          printf 'RELEASE_ID=%s\n' "$(cat "$RUNNER_TEMP/release-id")" >>"$GITHUB_ENV"
      - name: Upload only absent exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/publish-release.sh upload
      - name: Verify and publish exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/publish-release.sh publish
