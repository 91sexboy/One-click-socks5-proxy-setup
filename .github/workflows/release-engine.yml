name: release-engine

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ENGINE_TAG: engine-3proxy-0.9.9.0-r2
  SOURCE_ENGINE_TAG: engine-3proxy-0.9.9.0-r1
  BUILDER_IMAGE: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a

jobs:
  build:
    name: build-glibc-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build focal-compatible glibc amd64 engine
        run: |
          set -eu
          rm -rf dist
          mkdir dist
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src" -w /src \
            -e S5_BUILDER_IMAGE="$BUILDER_IMAGE" \
            "$BUILDER_IMAGE" sh -c '
              set -eu
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                git gcc make binutils libc6-dev ca-certificates >/dev/null
              sh .github/scripts/build-engine.sh glibc amd64 /src/dist
            '
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Upload versioned candidate bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-glibc-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: assemble-attest-and-publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true
      - name: Refuse non-develop dispatches
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/develop || {
            echo "release-engine must be dispatched from develop, got $GITHUB_REF" >&2
            exit 1
          }
      - name: Carry unchanged r1 assets by exact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          while read -r asset size sha; do
            gh release download "$SOURCE_ENGINE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --pattern "$asset.build-info" --dir .
            test "$(wc -c <"$asset" | tr -d '[:space:]')" = "$size"
            printf '%s  %s\n' "$sha" "$asset" | sha256sum -c -
            grep -Fx "asset=$asset" "$asset.build-info"
            grep -Fx 'upstream_commit=da99424eac4092e3722f1a5b1844cfe80478f580' "$asset.build-info"
            grep -Fx "sha256=$sha" "$asset.build-info"
            grep -Fx "size=$size" "$asset.build-info"
            grep -F 'compiler=' "$asset.build-info"
            printf '%s  %s\n' "$sha" "$asset" >"$asset.sha256"
            printf 'carried_from_release=%s\n' "$SOURCE_ENGINE_TAG" >>"$asset.build-info"
          done <<'CARRIED'
          3proxy-0.9.9.0-da99424-linux-glibc-arm64 279288 344e482272e5c16d1f9c762d7ed240cda43bb050a53be767e5393a616607ccf5
          3proxy-0.9.9.0-da99424-linux-musl-amd64 298280 ac3fe1a7d52d2b1494d4d00884fc7517acb2340454c2653c95a7346c05d69298
          3proxy-0.9.9.0-da99424-linux-musl-arm64 277624 38f2733dfc5d375a4faaebe79f66bd181c7cc3e7b3eb9443c3ac4476fbfeebeb
          CARRIED
      - name: Verify the assembled release payload
        run: |
          set -eu
          cd dist
          test "$(find . -maxdepth 1 -type f -name '3proxy-0.9.9.0-da99424-linux-*-*' ! -name '*.sha256' ! -name '*.build-info' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*.build-info' | wc -l)" -eq 4
          cat ./*.sha256 | LC_ALL=C sort >SHA256SUMS
          sha256sum -c SHA256SUMS
          ../.github/scripts/verify-glibc-floor.sh \
            3proxy-0.9.9.0-da99424-linux-glibc-amd64 2 31 >/dev/null

          : >BUILD-INFO.txt
          for info in $(find . -maxdepth 1 -type f -name '*.build-info' | LC_ALL=C sort); do
            asset=$(sed -n 's/^asset=//p' "$info" | head -n 1)
            test -n "$asset"
            printf '### asset=%s\n' "$asset" >>BUILD-INFO.txt
            cat "$info" >>BUILD-INFO.txt
            printf '\n' >>BUILD-INFO.txt
          done
      - name: Attest newly built glibc amd64 binary
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/3proxy-0.9.9.0-da99424-linux-glibc-amd64
      - name: Atomically claim r2 tag and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "refusing to replace existing release: $ENGINE_TAG" >&2
            exit 1
          }
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$ENGINE_TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ENGINE_TAG" --jq .object.sha 2>/dev/null || true)
            test "$actual" = "$GITHUB_SHA" || {
              echo "refusing tag owned by another commit: $ENGINE_TAG -> ${actual:-missing}" >&2
              exit 1
            }
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ENGINE_TAG" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          gh release create "$ENGINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "3proxy 0.9.9.0 engine r2" \
            --notes "Versioned 3proxy 0.9.9.0 binaries for socks5.sh. glibc-amd64 is built against the Ubuntu 20.04 / GLIBC 2.31 baseline; the other three verified r1 binaries are carried by exact digest. Verify with SHA256SUMS and the original/r2 GitHub artifact attestations."
      - name: Upload complete r2 payload to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ENGINE_TAG" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          gh release upload "$ENGINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            dist/3proxy-0.9.9.0-da99424-linux-* \
            dist/SHA256SUMS dist/BUILD-INFO.txt
      - name: Verify tag and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ENGINE_TAG" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name==env.ENGINE_TAG and .draft==true) | .id')
          case "$release_id" in '' | *[!0-9]*) echo "cannot locate draft release id" >&2; exit 1 ;; esac
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)
          test "$draft" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true >/dev/null
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$ENGINE_TAG" --jq .object.sha)
          test "$actual" = "$GITHUB_SHA"
