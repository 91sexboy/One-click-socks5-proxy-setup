name: xray-only-ci

on:
  # A PR commit runs once, through pull_request; push covers only the primary
  # branch, where a merge lands. Pushing every branch doubled each PR's runs.
  push:
    branches: [xray-only]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR supersedes the older run. Runs on the primary
# branch are never cancelled: each merge keeps its own complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install PyYAML
        # python3-yaml is installed rather than assumed: the workflow-structure
        # check below is the only independent oracle for "every job has a
        # timeout", and an ImportError must not decide whether it runs.
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Pin shellcheck 0.10.0
        # Not from apt: the distro version drifts between releases, so a finding
        # that fires only on the runner could never be reproduced locally. The
        # checksum makes this a pin rather than a fetch.
        run: |
          SC_URL='https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz'
          SC_SHA='6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
          cd "$(mktemp -d)" || exit 1
          curl -fsSLO "$SC_URL"
          echo "$SC_SHA  shellcheck-v0.10.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.10.0.linux.x86_64.tar.xz
          sudo install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
      - name: Shell and Python syntax
        run: |
          for f in socks5.sh tests/run.sh tests/lib/*.sh tests/unit/*.sh \
            tests/protocol/*.sh .github/scripts/*.sh; do
            sh -n "$f"
          done
          for f in tests/protocol/*.py tests/lib/*.py .github/scripts/*.py; do
            python3 -m py_compile "$f"
          done
          # py_compile accepts a call with the wrong argument count, so a
          # signature change that misses one caller stays green until the job
          # that runs it gets there -- for hold_connections.py that is the whole
          # memory gate.
          python3 tests/protocol/arity_audit.py
      - name: ShellCheck
        # socks5.sh is linted with no exclusions: a clean production file is the
        # baseline the test exemptions are measured against. The test-side -e
        # flags are structural consequences of the harness -- SC2317 because the
        # runner invokes test files by path and they override functions, SC2034
        # because fixture variables are read by the sourced socks5.sh, SC2016
        # because quoted grep/sed patterns must reach their consumer unexpanded.
        # Anything narrower carries an inline disable so it stays visible.
        run: |
          shellcheck -s sh socks5.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 \
            tests/run.sh tests/lib/*.sh tests/unit/*.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 \
            tests/protocol/*.sh .github/scripts/*.sh
      - name: Workflow inline shell
        # The two steps above only read files, so the workflow's own inline
        # run: blocks were checked by neither -- the lifecycle gates were moved
        # into .github/scripts precisely to escape that blind spot. This puts
        # every remaining block through the same sh -n and shellcheck, so a
        # block added later is covered without being moved into a file first.
        run: sh .github/scripts/lint-workflow-shell.sh
      - name: Active production path is Xray-only
        run: |
          # set -e does not apply to a command a ! inverts, so `! grep ...` did not
          # fail this step: a reintroduced 3proxy reference passed lint silently.
          if grep -nE '3proxy|users\.cfg|socks -4|auth strong|source-build' socks5.sh; then
            echo "the production path must not reference the 3proxy engine" >&2; exit 1
          fi
          grep -q 'protocol.*mixed' README.md
          grep -q 'protocol.*mixed' README.zh-CN.md
      - name: Workflow structure has an independent oracle
        run: |
          python3 .github/scripts/check-workflow.py .github/workflows/ci.yml
          python3 .github/scripts/check-workflow.py .github/workflows/publish-xray-raw.yml
          python3 tests/lib/workflow_contract_regression.py
          python3 -O tests/lib/workflow_contract_regression.py

  # Parsing socks5.sh does not depend on the shell a unit leg runs the suite
  # under, so it runs once per commit rather than on every leg.
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Syntax
        run: |
          sh -n socks5.sh
          dash -n socks5.sh
          bash -n socks5.sh
          busybox sh -n socks5.sh

  unit:
    runs-on: ${{ matrix.shell.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell:
          - runner: ubuntu-24.04
            command: sh
          - runner: ubuntu-24.04
            command: dash
          # bash is the /bin/sh of the EL family, which SPEC 8 lists as supported.
          # The sh leg above is dash on this runner, so without bash the matrix
          # covered one interpreter twice and left the other untested.
          - runner: ubuntu-24.04
            command: bash
          - runner: ubuntu-24.04
            command: busybox sh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # dash is the runner's /bin/sh and bash its login shell; only BusyBox is
      # missing from the image.
      - name: Install BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Unit suite
        env:
          S5_TEST_SHELL: ${{ matrix.shell.command }}
        run: sh tests/run.sh

  xray-assets:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            source_asset: Xray-linux-64.zip
            source_size: 21136402
            source_sha: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
            asset: xray-v26.3.27-linux-amd64
            size: 36577406
            sha: 8255dd939c34cf966cc91517b6324dd3c8d0bcf49ffac8beca049a38c46845ed
            elf_arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            source_asset: Xray-linux-arm64-v8a.zip
            source_size: 19716427
            source_sha: 4d30283ae614e3057f730f67cd088a42be6fdf91f8639d82cb69e48cde80413c
            asset: xray-v26.3.27-linux-arm64
            size: 34209918
            sha: c2d20a7045250497083afea0d79db0672f6c89a25aaaf37c92de034d6b764b04
            elf_arch: aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Reproduce and verify pinned raw Xray asset
        env:
          XRAY_ARCH: ${{ matrix.arch }}
          XRAY_SOURCE_ASSET: ${{ matrix.source_asset }}
          XRAY_SOURCE_SIZE: ${{ matrix.source_size }}
          XRAY_SOURCE_SHA: ${{ matrix.source_sha }}
          XRAY_ASSET: ${{ matrix.asset }}
          XRAY_SIZE: ${{ matrix.size }}
          XRAY_SHA: ${{ matrix.sha }}
          XRAY_ELF_ARCH: ${{ matrix.elf_arch }}
        run: |
          set -eu
          mkdir prepared
          curl -fsSL --proto '=https' --proto-redir '=https' --max-filesize "$((XRAY_SOURCE_SIZE + 1))" \
            -o upstream.zip "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/$XRAY_SOURCE_ASSET"
          test "$(wc -c <upstream.zip | tr -d '[:space:]')" = "$XRAY_SOURCE_SIZE"
          test "$(sha256sum upstream.zip | awk '{print $1}')" = "$XRAY_SOURCE_SHA"
          curl -fsSL --proto '=https' --proto-redir '=https' --max-filesize "$((XRAY_SOURCE_SIZE + 1))" \
            -o mirror.zip "https://github.com/91sexboy/One-click-socks5-proxy-setup/releases/download/xray-v26.3.27/$XRAY_SOURCE_ASSET"
          cmp upstream.zip mirror.zip
          python3 .github/scripts/prepare-xray-raw.py prepare \
            --arch "$XRAY_ARCH" --source upstream.zip --output prepared
          curl -fsSL --proto '=https' --proto-redir '=https' --max-filesize "$((XRAY_SIZE + 1))" \
            -o "$XRAY_ASSET" "https://github.com/91sexboy/One-click-socks5-proxy-setup/releases/download/xray-v26.3.27-r1/$XRAY_ASSET"
          test "$(wc -c <"$XRAY_ASSET" | tr -d '[:space:]')" = "$XRAY_SIZE"
          test "$(sha256sum "$XRAY_ASSET" | awk '{print $1}')" = "$XRAY_SHA"
          cmp "prepared/$XRAY_ASSET" "$XRAY_ASSET"
          file -b "$XRAY_ASSET" | grep -q 'ELF 64-bit'
          file -b "$XRAY_ASSET" | grep -q "$XRAY_ELF_ARCH"
          if file -b "$XRAY_ASSET" | grep -q 'dynamically linked'; then
            echo "the pinned binary is dynamically linked" >&2; exit 1
          fi
          chmod 0755 "$XRAY_ASSET"
          ./"$XRAY_ASSET" version

  xray-mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the preinstalled runtime tools
        run: sh .github/scripts/require-runner-tools.sh
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Run mixed protocol and duplex checks
        run: |
          set -eu
          root=$(mktemp -d)
          cleanup() {
            if test -n "${engine_pid:-}"; then kill "$engine_pid" 2>/dev/null || true; wait "$engine_pid" 2>/dev/null || true; fi
            if test -n "${target_pid:-}"; then kill "$target_pid" 2>/dev/null || true; wait "$target_pid" 2>/dev/null || true; fi
            rm -rf "$root"
          }
          trap cleanup EXIT HUP INT TERM
          # shellcheck source=/dev/null
          . .github/scripts/lifecycle-common.sh
          lifecycle_write_fixtures "$root"
          lifecycle_start_duplex_target "$root"
          OUTDIR="$root/out" PASSFILE="$root/pass" PORT=23456 ARCH=amd64 \
            sh tests/protocol/start_engine.sh >"$root/engine.log" 2>&1 &
          engine_pid=$!
          for n in $(seq 1 600); do
            test -s "$root/out/ready" && break
            kill -0 "$engine_pid" 2>/dev/null || break
            sleep 0.2
          done
          if ! test -s "$root/out/ready" || ! kill -0 "$engine_pid" 2>/dev/null; then
            # Replace, never drop: dropping every line with a secret also
            # dropped the diagnostic the secret appeared in.
            lifecycle_redaction_file "$root/redact.pat" "$root/pass"
            lifecycle_redact "$root/redact.pat" <"$root/engine.log" >&2
            exit 1
          fi
          ready_port=$(cat "$root/out/ready")
          # lifecycle_start_duplex_target set target_port; ShellCheck does not
          # follow the sourced helper.
          # shellcheck disable=SC2154
          PASSFILE="$root/pass" PORT="$ready_port" TARGET_PORT="$target_port" \
            REPORT="$root/report" OUT="$root/probe" \
            sh tests/protocol/run_xray_mixed.sh

  xray-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the preinstalled runtime tools
        run: sh .github/scripts/require-runner-tools.sh
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Run real systemd lifecycle
        # The lifecycle body is a file rather than an inline block: shell in YAML
        # is read by no linter, and extracting its OpenRC sibling exposed two
        # checks that could not fail.
        run: sh .github/scripts/systemd-lifecycle.sh


  openrc-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "alpine:3.20"
            hostile_curl: "0"
            quota_blind: "0"
          - image: "alpine:3.22"
            hostile_curl: "1"
            quota_blind: "1"
          - image: "alpine:3.24"
            hostile_curl: "0"
            quota_blind: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run Alpine OpenRC lifecycle
        env:
          ALPINE_IMAGE: ${{ matrix.image }}
          ALPINE_HOSTILE_CURL: ${{ matrix.hostile_curl }}
          ALPINE_QUOTA_BLIND: ${{ matrix.quota_blind }}
        run: |
          # The lifecycle body is a file rather than a single-quoted argument:
          # one apostrophe in it used to close the argument and hand the rest to
          # the host shell, and as a file it is linted like every other script.
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            -e ALPINE_HOSTILE_CURL="$ALPINE_HOSTILE_CURL" \
            -e ALPINE_QUOTA_BLIND="$ALPINE_QUOTA_BLIND" "$ALPINE_IMAGE" \
            sh /src/.github/scripts/alpine-lifecycle.sh

  systemd-assertion-controls:
    needs: xray-systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutation: [fail, skip, unreachable, swallow]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the preinstalled runtime tools
        run: sh .github/scripts/require-runner-tools.sh
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Exercise native assertion reachability and failure propagation
        env:
          ASSERTION_MUTATION: ${{ matrix.mutation }}
        run: python3 .github/scripts/lifecycle-assert-control.py systemd "$ASSERTION_MUTATION"

  openrc-assertion-controls:
    needs: openrc-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # What the mutations prove -- that a broken assertion call is caught --
        # does not depend on the Alpine version; openrc-integration runs the
        # full gate on every supported image.
        image: ["alpine:3.24"]
        mutation: [fail, skip, unreachable, swallow]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Exercise native assertion reachability and failure propagation
        env:
          ASSERTION_MUTATION: ${{ matrix.mutation }}
          ALPINE_IMAGE: ${{ matrix.image }}
        run: |
          # Python does not reap orphaned OpenRC daemons when it becomes PID 1.
          docker run --rm --init --privileged -e GITHUB_ACTIONS=true -e ASSERTION_MUTATION \
            -v "$PWD:/src:ro" -w /src "$ALPINE_IMAGE" \
            sh -c 'apk add --no-cache python3 >/dev/null &&
              python3 .github/scripts/lifecycle-assert-control.py openrc "$ASSERTION_MUTATION"'

  memory-report:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the preinstalled runtime tools
        run: sh .github/scripts/require-runner-tools.sh
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Prove descriptor-local peaks with a released high then low workload
        run: sudo env GITHUB_ACTIONS=true python3 .github/scripts/memory-peak-check.py --real-cgroup
      - name: Measure Xray process and cgroup memory
        env:
          XRAY_ARCH: ${{ matrix.arch }}
        run: sh .github/scripts/memory-report.sh
      - name: Retain paired memory measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-comparison-${{ matrix.arch }}
          path: memory-comparison-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
