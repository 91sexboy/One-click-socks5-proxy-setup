name: xray-only-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install PyYAML
        # python3-yaml is installed rather than assumed: the workflow-structure
        # check below is the only independent oracle for "every job has a
        # timeout", and an ImportError must not decide whether it runs.
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Pin shellcheck 0.10.0
        # Not from apt: the distro version drifts between releases, so a finding
        # that fires only on the runner could never be reproduced locally. The
        # checksum makes this a pin rather than a fetch.
        run: |
          SC_URL='https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz'
          SC_SHA='6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
          cd "$(mktemp -d)"
          curl -fsSLO "$SC_URL"
          echo "$SC_SHA  shellcheck-v0.10.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.10.0.linux.x86_64.tar.xz
          sudo install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
      - name: Shell and Python syntax
        run: |
          for f in socks5.sh tests/run.sh tests/lib/*.sh tests/unit/*.sh \
            tests/protocol/*.sh .github/scripts/*.sh; do
            sh -n "$f"
          done
          for f in tests/protocol/*.py; do
            python3 -m py_compile "$f"
          done
          # py_compile accepts a call with the wrong argument count, so a
          # signature change that misses one caller stays green until the job
          # that runs it gets there -- for hold_connections.py that is the whole
          # memory gate.
          python3 tests/protocol/arity_audit.py
      - name: ShellCheck
        # socks5.sh is linted with no exclusions: a clean production file is the
        # baseline the test exemptions are measured against. The test-side -e
        # flags are structural consequences of the harness -- SC2317 because the
        # runner invokes test files by path and they override functions, SC2034
        # because fixture variables are read by the sourced socks5.sh, SC2016
        # because quoted grep/sed patterns must reach their consumer unexpanded.
        # Anything narrower carries an inline disable so it stays visible.
        run: |
          shellcheck -s sh socks5.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 \
            tests/run.sh tests/lib/*.sh tests/unit/*.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 \
            tests/protocol/*.sh .github/scripts/*.sh
      - name: Active production path is Xray-only
        run: |
          ! grep -nE '3proxy|users\.cfg|socks -4|auth strong|source-build' socks5.sh
          grep -q 'protocol.*mixed' README.md
          grep -q 'protocol.*mixed' README.zh-CN.md
      - name: The release gates must have no escape hatch
        run: |
          # No job may declare itself non-blocking. Matched as a YAML key so this
          # guard does not trip over its own text or over a comment.
          if grep -nE '^[[:space:]]+continue-on-error[[:space:]]*:' .github/workflows/ci.yml; then
            echo "no job in this workflow may use continue-on-error" >&2; exit 1
          fi
          # Every job must declare a timeout. Both counts are anchored to
          # job-level indentation (exactly four spaces): a step-level
          # timeout-minutes would otherwise balance a job that has none.
          jobs=$(awk '/^jobs:/{f=1;next} f && /^  [a-z][a-z0-9-]*:$/{n++} END{print n+0}' .github/workflows/ci.yml)
          tos=$(grep -c '^    timeout-minutes:' .github/workflows/ci.yml)
          if [ "$jobs" -ne "$tos" ]; then
            echo "job count ($jobs) does not match job-level timeout count ($tos)" >&2; exit 1
          fi
      - name: Workflow structure has an independent oracle
        run: |
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/ci.yml', encoding='utf-8') as handle:
              workflow = yaml.safe_load(handle)
          jobs = workflow['jobs']
          assert jobs
          for name, job in jobs.items():
              assert job.get('timeout-minutes'), name
              assert 'continue-on-error' not in job, name
              for step in job.get('steps', []):
                  assert step.get('run') != 'true', name
                  assert 'continue-on-error' not in step, name
          print('jobs=%d' % len(jobs))
          PY

  unit:
    runs-on: ${{ matrix.shell.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell:
          - runner: ubuntu-24.04
            command: sh
          - runner: ubuntu-24.04
            command: dash
          - runner: ubuntu-24.04
            command: busybox sh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install shell implementations
        run: sudo apt-get update && sudo apt-get install -y dash busybox
      - name: Syntax
        run: |
          sh -n socks5.sh
          dash -n socks5.sh
          busybox sh -n socks5.sh
      - name: Unit suite
        env:
          S5_TEST_SHELL: ${{ matrix.shell.command }}
        run: sh tests/run.sh

  xray-assets:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            asset: Xray-linux-64.zip
            size: 21136402
            sha: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
            binary_size: 36577406
            binary_sha: 8255dd939c34cf966cc91517b6324dd3c8d0bcf49ffac8beca049a38c46845ed
            elf_arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: Xray-linux-arm64-v8a.zip
            size: 19716427
            sha: 4d30283ae614e3057f730f67cd088a42be6fdf91f8639d82cb69e48cde80413c
            binary_size: 34209918
            binary_sha: c2d20a7045250497083afea0d79db0672f6c89a25aaaf37c92de034d6b764b04
            elf_arch: aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify pinned Xray archive
        env:
          XRAY_ASSET: ${{ matrix.asset }}
          XRAY_SIZE: ${{ matrix.size }}
          XRAY_SHA: ${{ matrix.sha }}
          XRAY_BINARY_SIZE: ${{ matrix.binary_size }}
          XRAY_BINARY_SHA: ${{ matrix.binary_sha }}
          XRAY_ELF_ARCH: ${{ matrix.elf_arch }}
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --max-filesize "$((XRAY_SIZE + 1))" \
            -o "$XRAY_ASSET" "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/$XRAY_ASSET"
          test "$(wc -c <"$XRAY_ASSET" | tr -d '[:space:]')" = "$XRAY_SIZE"
          test "$(sha256sum "$XRAY_ASSET" | awk '{print $1}')" = "$XRAY_SHA"
          test "$(unzip -Z1 "$XRAY_ASSET" | grep -cxF xray)" = 1
          test "$(unzip -Z1 "$XRAY_ASSET" | wc -l | tr -d '[:space:]')" = 5
          unzip -p "$XRAY_ASSET" xray > xray
          chmod 0755 xray
          # socks5.sh enforces the extracted binary's own size and digest and the
          # ELF architecture, and this is the only job that runs on arm64. Checking
          # the archive alone left a wrong arm64 binary pin breaking every arm64
          # install with CI green.
          test "$(wc -c <xray | tr -d '[:space:]')" = "$XRAY_BINARY_SIZE"
          test "$(sha256sum xray | awk '{print $1}')" = "$XRAY_BINARY_SHA"
          file -b xray | grep -q 'ELF 64-bit'
          file -b xray | grep -q "$XRAY_ELF_ARCH"
          ! file -b xray | grep -q 'dynamically linked'
          ./xray version

  xray-mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install protocol tools
        run: sudo apt-get update && sudo apt-get install -y python3 curl unzip file
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Run mixed protocol and duplex checks
        run: |
          set -eu
          root=$(mktemp -d)
          cleanup() {
            if test -n "${engine_pid:-}"; then kill "$engine_pid" 2>/dev/null || true; wait "$engine_pid" 2>/dev/null || true; fi
            if test -n "${target_pid:-}"; then kill "$target_pid" 2>/dev/null || true; wait "$target_pid" 2>/dev/null || true; fi
            rm -rf "$root"
          }
          trap cleanup EXIT HUP INT TERM
          printf 'ciuser\nCISecret_123~x\n' >"$root/pass"
          chmod 0600 "$root/pass"
          # Bound on every address so the same target answers at both the
          # permitted 192.0.2.1 and the denied 127.0.0.1. The boundary case needs a
          # live listener at the denied address, or a refusal would only prove that
          # nothing was listening there.
          python3 tests/protocol/duplex_target.py --host 0.0.0.0 --host6 :: \
            --ready-file "$root/target.port" --count-file "$root/count" --report-file "$root/report" &
          target_pid=$!
          for n in $(seq 1 50); do test -s "$root/target.port" && break; sleep 0.1; done
          test -s "$root/target.port"
          target_port=$(cat "$root/target.port")
          OUTDIR="$root/out" PASSFILE="$root/pass" PORT=23456 ARCH=amd64 \
            sh tests/protocol/start_engine.sh >"$root/engine.log" 2>&1 &
          engine_pid=$!
          for n in $(seq 1 80); do test -s "$root/out/port" && break; sleep 0.2; done
          test -s "$root/out/port"
          PASSFILE="$root/pass" PORT=23456 TARGET_PORT="$target_port" \
            REPORT="$root/report" OUT="$root/probe" \
            sh tests/protocol/run_xray_mixed.sh

  xray-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 curl unzip file iproute2
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Run real systemd lifecycle
        run: |
          set -eu
          printf 'lifecycle: start\n'
          work=$(mktemp -d)
          printf 'lifecycle: workdir-ready\n'
          cleanup() {
            rm -f "$work/pass" "$work/answers" "$work/target.log" "$work/install.log" "$work/status.log" "$work/restart.log" "$work/uninstall.log" "$work/pass.update" "$work/answers.update" "$work/update.log"
            sh .github/scripts/remove-xray-namespace.sh
            rm -rf "$work"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0700 "$work"
          printf '2\ny\n23456\nciuser\nCISecret_123~x\n' >"$work/answers"
          chmod 0600 "$work/answers"
          printf '2\n' >"$work/answers.lang"
          printf '2\ny\n' >"$work/answers.uninstall"
          printf 'ciuser\nCISecret_123~x\n' >"$work/pass"
          chmod 0600 "$work/pass"
          sudo sh .github/scripts/run-socks5.sh install \
            "$work/answers" "$work/install.log" "$work/pass"
          printf 'lifecycle: install-ok\n'
          sudo find /etc/xray-socks5 /var/lib/xray-socks5 /usr/local/libexec/xray-socks5 \
            -maxdepth 2 -printf '%M %u:%g %p\n' 2>&1 || true
          test -e /etc/xray-socks5
          printf 'lifecycle: config-dir-entry-ok\n'
          sudo test -f /etc/xray-socks5/config.json
          printf 'lifecycle: config-file-ok\n'
          sudo test -f /var/lib/xray-socks5/state
          printf 'lifecycle: state-file-ok\n'
          sudo test -x /usr/local/libexec/xray-socks5/xray
          printf 'lifecycle: binary-file-ok\n'
          printf 'lifecycle: files-ok\n'
          test "$(sudo stat -c '%a' /etc/xray-socks5/config.json)" = 640
          test "$(sudo stat -c '%a' /var/lib/xray-socks5/state)" = 600
          printf 'lifecycle: modes-ok\n'
          sudo systemctl is-active --quiet xray-socks5.service
          printf 'lifecycle: active-ok\n'
          python3 - <<'PY'
          import socket
          s = socket.create_connection(('127.0.0.1', 23456), 5)
          s.close()
          PY
          sudo sh .github/scripts/run-socks5.sh status \
            "$work/answers.lang" "$work/status.log" "$work/pass"
          printf 'lifecycle: status-ok\n'
          printf 'lifecycle: status-log='
          sudo cat "$work/status.log" | tr '\n' ' '
          printf '\n'
          sudo grep -q 'mixed' "$work/status.log"
          printf 'lifecycle: status-content-ok\n'
          sudo sh .github/scripts/run-socks5.sh restart \
            "$work/answers.lang" "$work/restart.log" "$work/pass"
          printf 'lifecycle: restart-command-ok\n'
          sudo systemctl is-active --quiet xray-socks5.service
          printf 'lifecycle: restart-active-ok\n'
          # SPEC 5: systemd recovers a crash, and a configuration error exits 23
          # without entering a restart loop.
          restarts_before=$(systemctl show xray-socks5.service -p NRestarts --value)
          crash_pid=$(systemctl show xray-socks5.service -p MainPID --value)
          test "$crash_pid" -gt 0
          sudo kill -9 "$crash_pid"
          for n in $(seq 1 60); do
            new_pid=$(systemctl show xray-socks5.service -p MainPID --value)
            if test "$new_pid" != "$crash_pid" && test "$new_pid" -gt 0; then break; fi
            sleep 1
          done
          sudo systemctl is-active --quiet xray-socks5.service
          test "$(systemctl show xray-socks5.service -p MainPID --value)" != "$crash_pid"
          test "$(systemctl show xray-socks5.service -p NRestarts --value)" -gt "$restarts_before"
          python3 - <<'PY'
          import socket
          sock = socket.create_connection(('127.0.0.1', 23456), 20)
          sock.close()
          PY
          sudo cp /etc/xray-socks5/config.json "$work/good.json"
          printf '{broken\n' | sudo tee /etc/xray-socks5/config.json >/dev/null
          sudo systemctl restart xray-socks5.service || true
          for n in $(seq 1 30); do
            sudo systemctl is-active --quiet xray-socks5.service || break
            sleep 1
          done
          ! sudo systemctl is-active --quiet xray-socks5.service
          test "$(systemctl show xray-socks5.service -p ExecMainStatus --value)" = 23
          loop_restarts=$(systemctl show xray-socks5.service -p NRestarts --value)
          sleep 12
          test "$(systemctl show xray-socks5.service -p NRestarts --value)" = "$loop_restarts"
          sudo cp "$work/good.json" /etc/xray-socks5/config.json
          test "$(sudo stat -c '%U:%G %a' /etc/xray-socks5/config.json)" = "root:xray-socks5 640"
          sudo systemctl restart xray-socks5.service
          sudo systemctl is-active --quiet xray-socks5.service
          python3 tests/protocol/duplex_target.py --host 0.0.0.0 --host6 :: --ready-file "$work/target.port" --count-file "$work/count" --report-file "$work/report" >"$work/target.log" 2>&1 &
          target_pid=$!
          for n in $(seq 1 50); do test -s "$work/target.port" && break; sleep 0.1; done
          target_port=$(cat "$work/target.port")
          PASSFILE="$work/pass" PORT=23456 TARGET_PORT="$target_port" \
            REPORT="$work/report" OUT="$work/probe" \
            sh tests/protocol/run_xray_mixed.sh
          sudo sh tests/protocol/post_install_audit.sh / "$work/pass" systemd
          printf 'lifecycle: audit-ok\n'
          # SPEC 5: re-running install over an existing installation is an
          # in-place update. Rotate the credentials, keep the port, and require
          # the new identity in both the config and the state.
          printf '2\ny\n23456\nciuser2\nCISecret_456~y\n' >"$work/answers.update"
          printf 'ciuser2\nCISecret_456~y\n' >"$work/pass.update"
          chmod 0600 "$work/answers.update" "$work/pass.update"
          sudo sh .github/scripts/run-socks5.sh install \
            "$work/answers.update" "$work/update.log" "$work/pass.update"
          printf 'lifecycle: update-ok\n'
          sudo grep -q 'ciuser2' /etc/xray-socks5/config.json
          sudo grep -qE '^username[[:space:]]+ciuser2$' /var/lib/xray-socks5/state
          test ! -e /var/lib/xray-socks5/transaction
          test "$(sudo stat -c '%U:%G %a' /etc/xray-socks5/config.json)" = "root:xray-socks5 640"
          sudo systemctl is-active --quiet xray-socks5.service
          sudo sh tests/protocol/post_install_audit.sh / "$work/pass.update" systemd
          printf 'lifecycle: update-audit-ok\n'
          printf 'lifecycle: uninstall-preflight\n'
          sudo systemctl is-active xray-socks5.service || true
          sudo systemctl show xray-socks5.service -p MainPID -p ExecMainStatus -p NRestarts
          sudo id xray-socks5
          sudo stat -c '%M %U:%G %n' /etc/xray-socks5/config.json /var/lib/xray-socks5/state /usr/local/libexec/xray-socks5/xray
          sudo find /etc/xray-socks5 /var/lib/xray-socks5 /usr/local/libexec/xray-socks5 -maxdepth 2 -printf '%M %U:%G %p\n'
          sudo sh .github/scripts/run-socks5.sh uninstall \
            "$work/answers.uninstall" "$work/uninstall.log" "$work/pass"
          test ! -e /etc/xray-socks5
          test ! -e /var/lib/xray-socks5
          test ! -e /usr/local/libexec/xray-socks5
          if sudo grep -q 'CISecret_123~x' "$work/install.log"; then exit 1; else rc=$?; test "$rc" = 1 || exit 1; fi
          if sudo grep -q 'CISecret_123~x' "$work/status.log"; then exit 1; else rc=$?; test "$rc" = 1 || exit 1; fi
          if sudo grep -q 'CISecret_456~y' "$work/update.log"; then exit 1; else rc=$?; test "$rc" = 1 || exit 1; fi


  openrc-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.20", "alpine:3.24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run Alpine OpenRC lifecycle
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -eu
            apk add --no-cache openrc >/dev/null
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            rc-status -a >/dev/null 2>&1 || true
            umask 077
            work=$(mktemp -d)
            trap "rm -rf $work" EXIT HUP INT TERM
            printf "2\ny\n23456\nciuser\nCISecret_123~x\n" >"$work/answers"
            printf "ciuser\nCISecret_123~x\n" >"$work/pass"
            chmod 0600 "$work/answers" "$work/pass"
            if ! sh socks5.sh install <"$work/answers" >"$work/install.log" 2>&1; then
              cat "$work/install.log"
              exit 1
            fi
            test "$(stat -c "%U:%G %a" /etc/init.d/xray-socks5)" = "root:root 755"
            test "$(stat -c "%U:%G %a" /etc/xray-socks5/config.json)" = "root:xray-socks5 640"
            test "$(stat -c "%U:%G %a" /var/lib/xray-socks5/state)" = "root:root 600"
            # SPEC 5: re-running install over an existing installation is an
            # in-place update. Rotate the credentials, keep the port, and require
            # the new identity in both the config and the state.
            printf "2\ny\n23456\nciuser2\nCISecret_456~y\n" >"$work/answers.update"
            printf "ciuser2\nCISecret_456~y\n" >"$work/pass.update"
            chmod 0600 "$work/answers.update" "$work/pass.update"
            if ! sh socks5.sh install <"$work/answers.update" >"$work/update.log" 2>&1; then
              cat "$work/update.log"
              exit 1
            fi
            grep -q "ciuser2" /etc/xray-socks5/config.json
            grep -qE "^username[[:space:]]+ciuser2$" /var/lib/xray-socks5/state
            test ! -e /var/lib/xray-socks5/transaction
            test "$(stat -c "%U:%G %a" /etc/xray-socks5/config.json)" = "root:xray-socks5 640"
            rc-service xray-socks5 status
            pkgs_before=$(apk info | sort | sha256sum)
            printf "2\n" | sh socks5.sh status >"$work/status.log"
            printf "2\n" | sh socks5.sh restart
            rc-service xray-socks5 status
            grep -q "mixed" "$work/status.log"
            # SPEC 5: OpenRC recovers a crash with the listener returning, and a
            # configuration error does not enter an automatic restart loop.
            crash_pid=$(cat /run/openrc/options/xray-socks5/child_pid)
            test "$crash_pid" -gt 0
            kill -9 "$crash_pid"
            new_pid=0
            for n in $(seq 1 60); do
              new_pid=$(cat /run/openrc/options/xray-socks5/child_pid 2>/dev/null || printf 0)
              if test "$new_pid" != "$crash_pid" && test "$new_pid" -gt 0; then break; fi
              sleep 1
            done
            test "$new_pid" != "$crash_pid"
            test "$new_pid" -gt 0
            for n in $(seq 1 60); do
              ss -H -ltnp 2>/dev/null | grep -q "pid=$new_pid," && break
              sleep 1
            done
            ss -H -ltnp | grep -q "pid=$new_pid,"
            cp /etc/xray-socks5/config.json "$work/good.json"
            printf "{broken\n" >/etc/xray-socks5/config.json
            rc-service xray-socks5 restart || true
            for n in $(seq 1 30); do
              rc-service xray-socks5 status >/dev/null 2>&1 || break
              sleep 1
            done
            if rc-service xray-socks5 status >/dev/null 2>&1; then
              printf "a broken config left the service running\n" >&2
              exit 1
            fi
            # SPEC 8: a configuration error exits 23. OpenRC bounds respawns by
            # count rather than by exit status, so the status has to come from the
            # supervised binary, and the respawn guard is proven by child_pid
            # holding still across the settle window below.
            respawn_before=$(cat /run/openrc/options/xray-socks5/child_pid 2>/dev/null || printf none)
            broken_status=0
            /usr/local/libexec/xray-socks5/xray run -c /etc/xray-socks5/config.json \
              >"$work/broken.log" 2>&1 || broken_status=$?
            if test "$broken_status" != 23; then
              printf "a broken config exited %s, expected 23\n" "$broken_status" >&2
              cat "$work/broken.log" >&2
              exit 1
            fi
            for n in $(seq 1 12); do
              if ss -H -ltn 2>/dev/null | grep -q ":23456 "; then
                printf "a broken config produced a listener\n" >&2
                exit 1
              fi
              sleep 1
            done
            respawn_after=$(cat /run/openrc/options/xray-socks5/child_pid 2>/dev/null || printf none)
            if test "$respawn_after" != "$respawn_before"; then
              printf "a broken config respawned: child_pid %s then %s\n" \
                "$respawn_before" "$respawn_after" >&2
              exit 1
            fi
            # Redirection truncates in place, so the config keeps the owner and
            # mode the installer gave it. BusyBox cp replaces the destination and
            # would hand it the private attributes of the backup copy.
            cat "$work/good.json" >/etc/xray-socks5/config.json
            test "$(stat -c "%U:%G %a" /etc/xray-socks5/config.json)" = "root:xray-socks5 640"
            rc-service xray-socks5 restart
            rc-service xray-socks5 status
            sh tests/protocol/post_install_audit.sh / "$work/pass.update" openrc
            # SPEC 10: credentials reach neither argv nor the service environment.
            live_pid=$(cat /run/openrc/options/xray-socks5/child_pid)
            if tr "\0" "\n" <"/proc/$live_pid/cmdline" | grep -qE "CISecret_123~x|CISecret_456~y"; then
              printf "credential appeared in argv\n" >&2
              exit 1
            fi
            if tr "\0" "\n" <"/proc/$live_pid/environ" | grep -qE "CISecret_123~x|CISecret_456~y"; then
              printf "credential appeared in the service environment\n" >&2
              exit 1
            fi
            # SPEC 6: independent SOCKS5 and HTTP verification, separate from the
            # data-plane check the installer runs itself. The target binds every
            # address so it answers at both the permitted 192.0.2.1 and the denied
            # 127.0.0.1, which is what makes a boundary bypass visible.
            sh .github/scripts/add-test-target-addresses.sh
            python3 tests/protocol/duplex_target.py --host 0.0.0.0 --host6 :: \
              --ready-file "$work/target.port" \
              --count-file "$work/count" --report-file "$work/report" >"$work/target.log" 2>&1 &
            for n in $(seq 1 50); do test -s "$work/target.port" && break; sleep 0.2; done
            test -s "$work/target.port"
            PASSFILE="$work/pass.update" PORT=23456 TARGET_PORT="$(cat "$work/target.port")" \
              REPORT="$work/report" OUT="$work/probe" \
              sh tests/protocol/run_xray_mixed.sh
            printf "2\ny\n" | sh socks5.sh uninstall
            test "$(apk info | sort | sha256sum)" = "$pkgs_before"
            test ! -e /etc/xray-socks5
            test ! -e /var/lib/xray-socks5
            test ! -e /usr/local/libexec/xray-socks5
            test ! -e /etc/init.d/xray-socks5
            test ! -e /run/xray-socks5.pid
            ! grep -q "CISecret_123~x" "$work/install.log"
            ! grep -q "CISecret_456~y" "$work/update.log"
          '

  memory-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install memory tools
        run: sudo apt-get update && sudo apt-get install -y python3 curl unzip file iproute2
      - name: Add the test target addresses
        run: sudo sh .github/scripts/add-test-target-addresses.sh
      - name: Measure Xray process and cgroup memory
        run: |
          set -eu
          root=$(mktemp -d)
          cleanup() {
            if test -n "${holder_pid:-}"; then kill "$holder_pid" 2>/dev/null || true; wait "$holder_pid" 2>/dev/null || true; fi
            if test -n "${target_pid:-}"; then kill "$target_pid" 2>/dev/null || true; wait "$target_pid" 2>/dev/null || true; fi
            sh .github/scripts/remove-xray-namespace.sh
            rm -rf "$root"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0700 "$root"
          printf '2\ny\n23456\nciuser\nCISecret_123~x\n' >"$root/answers"
          chmod 0600 "$root/answers"
          printf 'ciuser\nCISecret_123~x\n' >"$root/pass"
          chmod 0600 "$root/pass"
          sudo sh .github/scripts/run-socks5.sh install \
            "$root/answers" "$root/install.log" "$root/pass"
          pid=$(systemctl show xray-socks5.service -p MainPID --value)
          test "$pid" -gt 0
          printf 'xray_process_pid=%s\n' "$pid"
          # Startup time comes from systemd's own monotonic timestamps rather
          # than the wall clock of the whole install, which includes the download.
          entered=$(systemctl show xray-socks5.service -p ActiveEnterTimestampMonotonic --value)
          exited=$(systemctl show xray-socks5.service -p InactiveExitTimestampMonotonic --value)
          test -n "$entered" && test -n "$exited"
          printf 'xray_startup_usec=%s\n' "$((entered - exited))"
          cgroup=$(systemctl show xray-socks5.service -p ControlGroup --value)
          cgdir="/sys/fs/cgroup$cgroup"
          python3 tests/protocol/duplex_target.py --host 0.0.0.0 --host6 :: \
            --ready-file "$root/target.port" --count-file "$root/count" \
            --report-file "$root/report" >"$root/target.log" 2>&1 &
          target_pid=$!
          for n in $(seq 1 50); do test -s "$root/target.port" && break; sleep 0.1; done
          test -s "$root/target.port"
          target_port=$(cat "$root/target.port")
          sudo sh .github/scripts/memory-sample.sh "$pid" reset "$cgdir"
          sudo sh .github/scripts/memory-sample.sh "$pid" idle "$cgdir"
          # SPEC 8 wants the idle/1/32/128 peaks kept apart, so each stage is
          # sampled while exactly that many tunnels are held open.
          for stage in 1 32 128; do
            rm -f "$root/held"
            python3 tests/protocol/hold_connections.py --host 127.0.0.1 --port 23456 \
              --target-host 192.0.2.1 --target-port "$target_port" \
              --passfile "$root/pass" --count "$stage" \
              --ready-file "$root/held" --max-seconds 60 >"$root/held.log" 2>&1 &
            holder_pid=$!
            for n in $(seq 1 150); do test -s "$root/held" && break; sleep 0.2; done
            if ! test "$(cat "$root/held" 2>/dev/null)" = "$stage"; then
              cat "$root/held.log" >&2
              exit 1
            fi
            sudo sh .github/scripts/memory-sample.sh "$pid" reset "$cgdir"
            sudo sh .github/scripts/memory-sample.sh "$pid" "conn$stage" "$cgdir"
            kill -TERM "$holder_pid" 2>/dev/null || true
            wait "$holder_pid" 2>/dev/null || true
            holder_pid=''
          done
          printf 'systemd_memory_current_bytes=%s\n' "$(systemctl show xray-socks5.service -p MemoryCurrent --value)"
          printf 'systemd_memory_peak_bytes=%s\n' "$(systemctl show xray-socks5.service -p MemoryPeak --value)"
          restarts=$(systemctl show xray-socks5.service -p NRestarts --value)
          printf 'xray_restart_count=%s\n' "$restarts"
          test "$restarts" = 0
          test "$(awk '$1 == "oom" {print $2}' "$cgdir/memory.events")" = 0
          test "$(awk '$1 == "oom_kill" {print $2}' "$cgdir/memory.events")" = 0
          sudo systemctl is-active --quiet xray-socks5.service
          if sudo grep -q 'CISecret_123~x' "$root/install.log"; then exit 1; else rc=$?; test "$rc" = 1 || exit 1; fi
          if grep -q 'CISecret_123~x' "$root/held.log"; then exit 1; else rc=$?; test "$rc" = 1 || exit 1; fi
