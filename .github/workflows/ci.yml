name: ci

# The complete 45-job workflow passed in run 33174398814 at df6885c. A green
# LOCAL unit suite still does not substitute for these jobs: they need real
# compilers, containers, init managers, accounts and listening ports.
#
# All runners are GitHub-hosted. Self-hosted runners must never be used: the
# protocol and integration jobs bind a proxy port and create system accounts.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# actions/checkout is pinned below to the full commit SHA that its v5.1.0 tag
# resolves to, so a retagged or compromised action cannot be substituted.

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install PyYAML and pinned shellcheck
        # python3-yaml is installed rather than assumed: the workflow-structure
        # check below is the only real oracle for "every job has a timeout", and
        # an ImportError must not be the thing that decides whether it runs.
        # shellcheck is NOT taken from apt: the distro's version drifts between
        # releases, and a finding that fires (or does not) only on the runner's
        # version makes the lint unreviewable -- local verification could never
        # reproduce it. The upstream static binary is pinned by sha256 instead.
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Pin shellcheck 0.10.0
        # The checksum makes the download a pin, not a fetch: a tampered or
        # retagged artifact fails here instead of silently linting with an
        # unknown binary. amd64 is the only lint runner (ubuntu-24.04).
        run: |
          SC_URL='https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz'
          SC_SHA='6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87'
          cd "$(mktemp -d)"
          curl -fsSLO "$SC_URL"
          echo "$SC_SHA  shellcheck-v0.10.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.10.0.linux.x86_64.tar.xz
          sudo install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
      - name: shellcheck
        # Production (socks5.sh) is linted with NO exclusions at all: a clean
        # production file is the baseline the test exemptions are measured
        # against, and any exclusion here could hide a real defect.
        #
        # The test invocations carry targeted -e flags, each justified below.
        # They are structural consequences of the harness design, not defects:
        #   - SC2317 "unreachable": the runner invokes each test file by path,
        #     and test files override functions (stubs, fake commands) that
        #     shellcheck cannot see being called through that indirection.
        #   - SC2034 "unused": the fixture variables are read by socks5.sh,
        #     which the files source in library mode; shellcheck does not track
        #     variables across a sourced file boundary.
        #   - SC2016 "single quotes": the quoted text is grep/sed patterns and
        #     stub bodies that must reach their consumer unexpanded.
        # No code is silenced that could hide a real defect in the tests: the
        # one test-side SC2086 (runner's $SHELL_UNDER_TEST, intentional word
        # splitting for `busybox sh`) and the SC2119 stub-shape call each
        # carry an inline disable instead, so they stay individually visible.
        run: |
          shellcheck -s sh socks5.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 tests/run.sh tests/lib/*.sh tests/unit/*.sh
          shellcheck -s sh -e SC2317,SC2034,SC2016 tests/protocol/*.sh
          shellcheck -s sh tests/stubs/*
      - name: python syntax
        run: |
          python3 -m py_compile tests/protocol/socks_probe.py
          python3 -m py_compile tests/pty/interrupt.py
          python3 -m py_compile tests/pty/stty_capture.py
          python3 -m py_compile tests/pty/show_xtrace.py
      - name: Documentation must never advertise SOCKS4
        run: |
          # The allowlist exempts a line from the advertisement check, so every
          # token in it is a hole. Each one below is the sole cover for exactly
          # one README line, and is specific enough that it cannot appear in an
          # advertisement. The previous list carried bare negations -- `never`,
          # `does not`, `cannot`, `refus`, `fails` -- which exempt a line for
          # negating anything at all: "SOCKS4 is fully supported; the password is
          # never logged" passed. `enable SOCKS4` was worse, exempting the literal
          # sentence "We enable SOCKS4 for legacy clients". Six tokens covered no
          # line at all. Keep this list minimal and line-specific; if a README
          # edit trips it, reword the README rather than widening the allowlist.
          if grep -rniE 'socks4' README.md | grep -viE 'not supported|rejection tests|no option|only a user-ID|not[^ ]* enable SOCKS4|fails the job'; then
            echo "README must not advertise SOCKS4 in any form" >&2
            exit 1
          fi
          # ...and the number of SOCKS4-mentioning lines is pinned. Without this,
          # a NEW advertisement that happens to contain a token meant for a
          # different line is exempted silently. Any change to the count must be
          # a deliberate edit here, which forces the new line to be read.
          n=$(grep -rciE 'socks4' README.md)
          if [ "$n" -ne 6 ]; then
            echo "README has $n SOCKS4-mentioning lines, expected 6." >&2
            echo "Read the new/removed line, confirm it is not an offer, then update this count." >&2
            exit 1
          fi
      - name: The release gates must have no escape hatch
        run: |
          for f in tests/protocol/run_protocol.sh tests/protocol/acl_resolution.sh; do
            if grep -nE 'SKIP_GATE|FORCE_PASS|allow.?failure' "$f"; then
              echo "$f must not contain a gate bypass" >&2; exit 1
            fi
          done
          # No job may declare itself non-blocking. Matched as a YAML key so
          # this guard does not trip over its own text or over a comment.
          if grep -nE '^[[:space:]]+continue-on-error[[:space:]]*:' .github/workflows/ci.yml; then
            echo "no job in this workflow may use continue-on-error" >&2; exit 1
          fi
          # Every job must declare a timeout. Both counts are anchored to
          # job-level indentation (exactly four spaces): `^[[:space:]]*` also
          # matched a step-level timeout-minutes, so a timeout added inside one
          # job's step would have balanced the total for a different job that
          # had none, and the guard would pass with a job left unbounded.
          jobs=$(awk '/^jobs:/{f=1;next} f && /^  [a-z][a-z0-9-]*:$/{n++} END{print n+0}' .github/workflows/ci.yml)
          tos=$(grep -c '^    timeout-minutes:' .github/workflows/ci.yml)
          if [ "$jobs" -ne "$tos" ]; then
            echo "job count ($jobs) does not match job-level timeout count ($tos)" >&2; exit 1
          fi
          # A YAML parse is the independent oracle for the two greps above, and
          # is mandatory here: on the runner PyYAML either imports or the job
          # fails. Skipping it locally is acceptable; skipping it in CI would
          # leave the only real check of this invariant never actually run.
          python3 - .github/workflows/ci.yml <<'PYEOF'
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1]))
          jobs = d["jobs"]
          missing = [n for n, j in jobs.items() if not j.get("timeout-minutes")]
          if missing:
              sys.exit("jobs without timeout-minutes: %s" % ", ".join(missing))
          print("%d jobs, all with a timeout" % len(jobs))
          PYEOF

  # ------------------------------------------------------------ unit tests
  # The same suite that runs locally, under all three target shells.
  unit:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install dash and busybox
        run: sudo apt-get update && sudo apt-get install -y dash busybox
      - run: sh -n socks5.sh
      - run: dash -n socks5.sh
      - run: busybox sh -n socks5.sh
      - run: sh tests/run.sh
      - run: S5_TEST_SHELL=dash sh tests/run.sh
      - run: S5_TEST_SHELL='busybox sh' sh tests/run.sh

  # -------------------------------------------------- 16-cell build matrix
  # 8 OS versions x 2 architectures. Every cell blocks the release, Alpine
  # included: there is no experimental tier.
  build-matrix:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "debian:13"
          - "alpine:3.20"
          - "alpine:3.24"
          - "quay.io/centos/centos:stream9"
          - "quay.io/centos/centos:stream10"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build in ${{ matrix.image }} on ${{ matrix.runner }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq git build-essential curl python3 >/dev/null
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git build-base musl-dev linux-headers curl python3 >/dev/null
            else
              (dnf install -y -q git gcc make python3 || yum install -y -q git gcc make python3) >/dev/null
            fi
            # curl is deliberately absent from the dnf/yum list above: the
            # CentOS Stream images ship curl-minimal, which already provides
            # /usr/bin/curl and refuses to coexist with the curl package.
            # Assert instead of install, so a genuinely missing curl fails
            # here rather than as a confusing protocol error later.
            command -v curl || { echo "curl missing after bootstrap"; exit 1; }
            ROOT=$(mktemp -d); : > "$ROOT/.s5-test-root"
            S5_TEST_MODE=1 S5_TEST_ROOT=$ROOT S5_LIB_ONLY=1 \
            S5_SKIP_OWNERSHIP=1 S5_ASSUME_ROOT=1 sh -c "
              . /src/socks5.sh
              s5_build_3proxy
              test -f \"\$S5_BIN\" || { echo no binary >&2; exit 1; }
              test -x \"\$S5_BIN\" || { echo binary not executable >&2; exit 1; }
            "
          '

  # -------------------------------- protocol acceptance + SOCKS4 release gate
  # The seven protocol cases against a real engine. This job is a HARD gate on
  # every cell, Alpine included, and never uses continue-on-error.
  #
  # NOTE ON SCOPE: this job builds the pinned commit, renders the production
  # configuration, and runs the engine DIRECTLY. It proves the protocol
  # boundary and the rendered config. It does NOT install a service; real
  # systemd and OpenRC installation are the separate jobs below.
  #
  # The engine is confined to loopback via the S5_LISTEN override, which is
  # only honoured under S5_TEST_MODE=1. Production always binds 0.0.0.0.
  protocol:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "debian:13"
          - "alpine:3.20"
          - "alpine:3.24"
          - "quay.io/centos/centos:stream9"
          - "quay.io/centos/centos:stream10"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Protocol acceptance in ${{ matrix.image }}
        run: |
          docker run --rm --cap-add=NET_ADMIN -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq git build-essential curl python3 ca-certificates iproute2 >/dev/null
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git build-base musl-dev linux-headers curl python3 ca-certificates iproute2 >/dev/null
            else
              (dnf install -y -q git gcc make python3 ca-certificates iproute || yum install -y -q git gcc make python3 ca-certificates iproute) >/dev/null
            fi
            # curl is deliberately absent from the dnf/yum list above: the
            # CentOS Stream images ship curl-minimal, which already provides
            # /usr/bin/curl and refuses to coexist with the curl package.
            # Assert instead of install, so a genuinely missing curl fails
            # here rather than as a confusing protocol error later.
            command -v curl || { echo "curl missing after bootstrap"; exit 1; }

            # Generated at runtime, never committed, never in argv, never
            # exported. Written to a 0600 file and removed when the job ends.
            SECRETS=$(mktemp -d); chmod 0700 "$SECRETS"
            trap "rm -rf $SECRETS" EXIT HUP INT TERM
            umask 077
            tr -dc "A-Za-z0-9._~-" </dev/urandom | head -c 32 > "$SECRETS/pass"
            chmod 0600 "$SECRETS/pass"

            OUT=$(mktemp -d)
            OUTDIR=$OUT PROXY_USER=ciuser PASSFILE="$SECRETS/pass" \
              sh tests/protocol/start_engine.sh

            # The credential is handed over as a path to a 0600 file. It never
            # becomes an environment variable and never appears in argv.
            PORT=$(cat "$OUT/port") \
            PROXY_USER=$(cat "$OUT/user") \
            PASSFILE="$SECRETS/pass" \
              sh tests/protocol/run_protocol.sh
          '

  # ----------------------------------- destination ACL applies to hostnames
  # H1: proves the private/loopback/metadata denies are not bypassable by
  # sending a domain name. Runs ONLY inside this container, binds a fake
  # 169.254.169.254 on lo, and never contacts a real metadata endpoint.
  # A bypass is a release blocker; this job is never non-blocking.
  acl-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "alpine:3.24", "quay.io/centos/centos:stream10"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Destination ACL holds for domain targets in ${{ matrix.image }}
        run: |
          docker run --rm --cap-add=NET_ADMIN -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -eu
            if command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq git build-essential curl python3 ca-certificates iproute2 >/dev/null
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache git build-base musl-dev linux-headers curl python3 ca-certificates iproute2 >/dev/null
            else
              (dnf install -y -q git gcc make python3 ca-certificates iproute || yum install -y -q git gcc make python3 ca-certificates iproute) >/dev/null
            fi
            # curl is deliberately absent from the dnf/yum list above: the
            # CentOS Stream images ship curl-minimal, which already provides
            # /usr/bin/curl and refuses to coexist with the curl package.
            # Assert instead of install, so a genuinely missing curl fails
            # here rather than as a confusing protocol error later.
            command -v curl || { echo "curl missing after bootstrap"; exit 1; }
            SECRETS=$(mktemp -d); chmod 0700 "$SECRETS"
            trap "rm -rf $SECRETS" EXIT HUP INT TERM
            umask 077
            tr -dc "A-Za-z0-9._~-" </dev/urandom | head -c 32 > "$SECRETS/pass"
            chmod 0600 "$SECRETS/pass"
            OUT=$(mktemp -d)
            OUTDIR=$OUT PROXY_USER=ciuser PASSFILE="$SECRETS/pass" \
              sh tests/protocol/start_engine.sh
            S5_ISOLATED=1 \
            PORT=$(cat "$OUT/port") \
            PROXY_USER=$(cat "$OUT/user") \
            PASSFILE="$SECRETS/pass" \
              sh tests/protocol/acl_resolution.sh
          '

  # ------------------------------------------------ real systemd integration
  # GitHub runners ship systemd, so the full interactive installer is exercised
  # end to end here. This is the ONLY job that tests a real service install on
  # systemd, and it covers 2 of the 16 cells.
  #
  # It deliberately uses production defaults, which means the proxy binds
  # 0.0.0.0 for the duration of the job. The password is generated at runtime.
  systemd-integration:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            locale_stream: zh-default
          - runner: ubuntu-24.04-arm
            locale_stream: en-explicit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Full install lifecycle under real systemd
        run: |
          set -eu
          umask 077
          SECRETS=$(mktemp -d); chmod 0700 "$SECRETS"
          cleanup() { rm -rf "$SECRETS"; }
          trap cleanup EXIT HUP INT TERM
          tr -dc 'A-Za-z0-9._~-' </dev/urandom | head -c 32 >"$SECRETS/pass"
          chmod 0600 "$SECRETS/pass"
          PORT=41080

          # Answers are fed from a 0600 file; the password never enters argv,
          # the environment, or the job log. Round 16 order: language (this cell
          # picks blank = Chinese default), one [Y/n] confirmation, then the three
          # values with the password queued exactly once.
          case "${{ matrix.locale_stream }}" in
            zh-default) _selector=''; _direct_selector=1;;
            en-explicit) _selector=2; _direct_selector=2;;
          esac
          if [ "${{ matrix.locale_stream }}" = zh-default ]; then
            printf '\ny\n%s\nciuser\n' "$PORT" >"$SECRETS/answers"
          else
            printf '2\ny\n%s\nciuser\n' "$PORT" >"$SECRETS/answers"
          fi
          cat "$SECRETS/pass" >>"$SECRETS/answers"
          printf '\n' >>"$SECRETS/answers"
          chmod 0600 "$SECRETS/answers"
          # Redaction uses a sed SCRIPT FILE. Interpolating the password into a
          # sed expression would place it in sed's argv, visible to `ps`.
          { printf 's|'; cat "$SECRETS/pass"; printf '|***REDACTED***|g\n'; } >"$SECRETS/redact.sed"
          chmod 0600 "$SECRETS/redact.sed"
          sudo sh socks5.sh install <"$SECRETS/answers" >"$SECRETS/install.log" 2>&1 || {
            sed -f "$SECRETS/redact.sed" "$SECRETS/install.log" >&2; exit 1; }

          printf '%s\n' "$_direct_selector" | sudo sh socks5.sh status
          # No-argument mode: the same selected language, then menu action 1 (status).
          { printf '%s\n' "$_direct_selector"; printf '1\n'; } | sudo sh socks5.sh
          sudo systemctl is-active socks5-manager.service
          ss -ltn | grep ":$PORT "

          PORT=$PORT PROXY_USER=ciuser PASSFILE="$SECRETS/pass" \
            sh tests/protocol/run_protocol.sh

          printf '%s\n' "$_direct_selector" | sudo sh socks5.sh restart
          sudo systemctl is-active socks5-manager.service

          # `show` discloses the password and therefore refuses unless stdout is
          # a real terminal. Give it a pty and keep its output in a 0600 file
          # that is never printed; only the grep verdict reaches the log.
          script -qec 'printf "%s\n" "$_direct_selector" | sudo sh socks5.sh show' /dev/null >"$SECRETS/show.out" 2>&1
          grep -q 'socks5://ciuser:' "$SECRETS/show.out"

          # This script never touches the firewall, so no rule may exist for the port.
          if sudo iptables -S 2>/dev/null | grep -q "socks5-manager"; then
            echo "install created a firewall rule; v1 must not" >&2; exit 1
          fi

          printf '%s\ny\n' "$_direct_selector" | sudo sh socks5.sh uninstall
          test ! -e /etc/socks5-manager
          test ! -e /var/lib/socks5-manager
          test ! -e /usr/local/libexec/socks5-manager
          test ! -e /etc/systemd/system/socks5-manager.service
          if id socks5proxy >/dev/null 2>&1; then echo "account survived" >&2; exit 1; fi
          if getent group socks5proxy >/dev/null 2>&1; then echo "group survived" >&2; exit 1; fi
          # a system package must still be installed
          command -v git >/dev/null

  # --------------------------------------------- real OpenRC integration
  # The ONLY job that tests a real service install on OpenRC, covering 2 of the
  # 16 cells. Alpine is a fully supported target, so this job blocks the
  # release like every other.
  openrc-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "alpine:3.20"
            locale_stream: invalid-then-zh
          - image: "alpine:3.24"
            locale_stream: invalid-then-en
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install lifecycle under OpenRC in ${{ matrix.image }}
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -eu
            # Only what the job itself needs before the installer runs: openrc
            # because a container has no init system at all, python3 because the
            # protocol probe is a python script. Everything else -- git,
            # build-base, musl-dev, linux-headers, curl, ca-certificates,
            # iproute2 -- must come from the apk bootstrap performed by the
            # installer itself, which is exactly the behaviour this job
            # exists to verify.
            apk add --no-cache openrc python3 >/dev/null
            mkdir -p /run/openrc && touch /run/openrc/softlevel
            # A real Alpine boot initializes the dependency tree and the full
            # /run/openrc state-directory set. This container has no OpenRC PID
            # 1; softlevel alone leaves /run/openrc/exclusive absent, and 0.54
            # misreports the resulting ENOENT from svc_lock as "already
            # starting". rc-status drives rc_deptree_update_needed(), which
            # creates starting/started/exclusive and the other state dirs.
            rc-status -a >/dev/null 2>&1  # initialize OpenRC runtime before install
            umask 077
            SECRETS=$(mktemp -d); chmod 0700 "$SECRETS"
            trap "rm -rf $SECRETS" EXIT HUP INT TERM
            tr -dc "A-Za-z0-9._~-" </dev/urandom | head -c 32 > "$SECRETS/pass"
            chmod 0600 "$SECRETS/pass"
            if [ "${{ matrix.locale_stream }}" = invalid-then-zh ]; then
              printf "9\n\ny\n41080\nciuser\n" >"$SECRETS/answers"
            else
              printf "9\n2\ny\n41080\nciuser\n" >"$SECRETS/answers"
            fi
            cat "$SECRETS/pass" >>"$SECRETS/answers"
            printf "\n" >>"$SECRETS/answers"
            chmod 0600 "$SECRETS/answers"
            { printf '"'"'s|'"'"'; cat "$SECRETS/pass"; printf '"'"'|***REDACTED***|g\n'"'"'; } > "$SECRETS/redact.sed"
            chmod 0600 "$SECRETS/redact.sed"
            # Each lifecycle install creates the log inside the OpenRC container;
            # umask 077 is set before the redirection is opened.
            umask 077
            sh socks5.sh install < "$SECRETS/answers" > "$SECRETS/install.log" 2>&1 || {
              sed -f "$SECRETS/redact.sed" "$SECRETS/install.log" >&2
              # OpenRC-state diagnostics: set -e MUST be disabled first --
              # `rc-service status` returning stopped=3 was terminating this
              # block before any diagnostic beyond that first line could run.
              # the openrc-run "already starting" message is specifically
              # svc_lock/EWOULDBLOCK, so include the kernel lock table and the
              # inode of the service exclusive lock to identify its holder.
              set +e
              rc-service socks5-manager status >&2
              echo "status exit: $?" >&2
              ls -lai /run/openrc/exclusive /run/openrc/starting /run/openrc/started >&2 2>&1
              echo "kernel locks:" >&2
              cat /proc/locks >&2
              echo "process table:" >&2
              ps aux >&2
              rc-status -a >&2
              sleep 2
              rc-service socks5-manager start >&2
              echo "retried start exit: $?" >&2
              rc-service socks5-manager status >&2
              echo "retried status exit: $?" >&2
              exit 1; }
            if [ "${{ matrix.locale_stream }}" = invalid-then-zh ]; then
            else
            fi
            if [ "${{ matrix.locale_stream }}" = invalid-then-zh ]; then
              printf "\n" | sh socks5.sh status
            else
              printf "2\n" | sh socks5.sh status
            fi
            rc-service socks5-manager status
            # A real OpenRC restart, followed by manager and socket proof.
            if [ "${{ matrix.locale_stream }}" = invalid-then-zh ]; then
              printf "\n" | sh socks5.sh restart
            else
              printf "2\n" | sh socks5.sh restart
            fi
            rc-service socks5-manager status
            if command -v ss >/dev/null 2>&1; then
              ss -ltn | grep ":41080 "
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltn | grep ":41080 "
            else
              echo "neither ss nor netstat is available after installation" >&2
              exit 1
            fi
            PORT=41080 PROXY_USER=ciuser PASSFILE="$SECRETS/pass" \
              sh tests/protocol/run_protocol.sh
            if [ "${{ matrix.locale_stream }}" = invalid-then-zh ]; then
              printf "\n" | sh socks5.sh uninstall
            else
              printf "2\n" | sh socks5.sh uninstall
            fi
            test ! -e /etc/socks5-manager
            test ! -e /var/lib/socks5-manager
            test ! -e /usr/local/libexec/socks5-manager
            test ! -e /etc/init.d/socks5-manager
            if id socks5proxy >/dev/null 2>&1; then echo "account survived" >&2; exit 1; fi
            if getent group socks5proxy >/dev/null 2>&1; then echo "group survived" >&2; exit 1; fi
          '

  # ----------------- real systemd integration on Ubuntu, Debian, CentOS Stream
  # The Ubuntu job above covers systemd 24.04 on the runner itself; this job
  # adds 22.04, Debian and CentOS Stream as containerized systemd. A plain
  # container cannot test a service install because `systemctl` lies there --
  # so systemd is booted as PID 1 inside a privileged container and the full
  # lifecycle runs against it.
  #
  # The image installs ONLY what is needed to boot systemd. git, a compiler,
  # curl and the ss provider are deliberately absent, so this job also proves the
  # installer bootstraps its own prerequisites on a clean host, including the
  # port-probe package it needs before the port prompt.
  distro-systemd-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu:22.04 needs --no-install-recommends: `systemd` recommends
          # systemd-resolved there, whose postinst replaces the docker-mounted
          # /etc/resolv.conf and dies with "Device or resource busy" during
          # the image build. systemd-resolved is not needed to boot systemd in
          # a container. Debian's systemd does not pull it, so that cell is
          # left untouched.
          - image: "ubuntu:22.04"
            setup: "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv ca-certificates"
            locale_stream: zh-default
          - image: "debian:13"
            setup: "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd systemd-sysv ca-certificates"
            locale_stream: en-explicit
          - image: "quay.io/centos/centos:stream10"
            setup: "(dnf install -y -q systemd ca-certificates || yum install -y -q systemd ca-certificates)"
            locale_stream: invalid-then-en
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Full install lifecycle under real systemd in ${{ matrix.image }}
        run: |
          set -eu
          umask 077
          SECRETS=$(mktemp -d); chmod 0700 "$SECRETS"
          CID=""
          cleanup() {
            if [ -n "$CID" ]; then docker rm -f "$CID" >/dev/null 2>&1 || true; fi
            rm -rf "$SECRETS"
          }
          trap cleanup EXIT HUP INT TERM

          tr -dc 'A-Za-z0-9._~-' </dev/urandom | head -c 32 >"$SECRETS/pass"
          chmod 0600 "$SECRETS/pass"
          PORT=41080
          if [ "${{ matrix.locale_stream }}" = zh-default ]; then
            printf '\ny\n%s\nciuser\n' "$PORT" >"$SECRETS/answers"
          elif [ "${{ matrix.locale_stream }}" = invalid-then-en ]; then
            printf '9\n2\ny\n%s\nciuser\n' "$PORT" >"$SECRETS/answers"
          else
            printf '2\ny\n%s\nciuser\n' "$PORT" >"$SECRETS/answers"
          fi
          cat "$SECRETS/pass" >>"$SECRETS/answers"
          printf '\n' >>"$SECRETS/answers"
          chmod 0600 "$SECRETS/answers"
          { printf 's|'; cat "$SECRETS/pass"; printf '|***REDACTED***|g\n'; } >"$SECRETS/redact.sed"
          chmod 0600 "$SECRETS/redact.sed"

          docker build -t s5-systemd-target - <<DOCKERFILE
          FROM ${{ matrix.image }}
          RUN ${{ matrix.setup }}
          CMD ["/sbin/init"]
          DOCKERFILE

          CID=$(docker run -d --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/src" -w /src s5-systemd-target)

          # Wait for the manager to finish booting. `degraded` is acceptable in
          # a container; never reaching a running state is not. The first probe
          # can run before systemd has even created its dbus socket -- the exec
          # then fails with a connection error instead of reporting a state --
          # and states like initializing/starting are transient, so this is a
          # bounded poll (60 x 2s = 120s), not a single check. An unbounded
          # --wait would turn a broken boot into the job's 40-minute timeout
          # and cannot wait at all when the bus is not up; the state is never
          # discarded to /dev/null -- a dead container, a failed exec and a
          # still-starting system must be distinguishable, and a failing check
          # must explain itself.
          boot_ok=''
          i=0
          while [ "$i" -lt 60 ]; do
            BOOT_STATE=$(docker exec "$CID" systemctl is-system-running 2>&1 || true)
            case "$BOOT_STATE" in
              running|degraded) boot_ok=1; break ;;
              initializing|starting) sleep 2 ;;
              *) sleep 2 ;;  # bus not up yet, or unknown transient state -- keep trying within the budget
            esac
            i=$((i + 1))
          done
          echo "system boot state: $BOOT_STATE"
          if [ -z "$boot_ok" ]; then
            echo "systemd did not reach a running state within 120s" >&2
            docker ps -a --filter id="$CID" >&2 || true
            docker logs --tail 200 "$CID" >&2 || true
            docker exec "$CID" systemctl --failed --no-pager 2>&1 || true
            exit 1
          fi

          # Written from INSIDE the container through stdin: docker cp extracts
          # into the container's rootfs, and a path that is a mountpoint in the
          # container can shadow the copied file (observed on debian:13 -- cp
          # exits 0, /tmp/answers invisible to the next exec).
          docker exec -i "$CID" sh -c 'umask 077 && cat > /tmp/answers' <"$SECRETS/answers"
          docker exec "$CID" chmod 0600 /tmp/answers
          docker exec "$CID" sh -c 'umask 077; sh /src/socks5.sh install </tmp/answers >/tmp/install.log 2>&1; rc=$?; chmod 0600 /tmp/install.log; exit "$rc"' \
            || { docker exec "$CID" cat /tmp/install.log >"$SECRETS/install.log" 2>&1 || true
                 sed -f "$SECRETS/redact.sed" "$SECRETS/install.log" >&2
                 exit 1; }
          docker exec "$CID" rm -f /tmp/answers

          case "${{ matrix.locale_stream }}" in
            zh-default) _direct_selector='';;
            en-explicit) _direct_selector=2;;
            invalid-then-en) _direct_selector='9\n2';;
          esac
          printf '%s\n' "$_direct_selector" | docker exec "$CID" sh -c 'sh /src/socks5.sh status'
          docker exec "$CID" systemctl is-active socks5-manager.service
          docker exec "$CID" sh -c "ss -ltn | grep ':$PORT '"
          printf '%s\n' "$_direct_selector" | docker exec "$CID" sh -c 'sh /src/socks5.sh restart'
          docker exec "$CID" systemctl is-active socks5-manager.service

          # No firewall rule may exist for the port: v1 never creates one.
          # Matching the project comment missed an unlabeled rule opening the
          # port; match the port instead.
          if docker exec "$CID" sh -c "command -v iptables >/dev/null 2>&1 && iptables -S 2>/dev/null | grep -q -- '--dport $PORT '"; then
            echo "install created a firewall rule; v1 must not" >&2; exit 1
          fi

          docker exec "$CID" sh -c 'printf "2\ny\n" | sh /src/socks5.sh uninstall'
          docker exec "$CID" sh -c 'test ! -e /etc/socks5-manager && test ! -L /etc/socks5-manager'
          docker exec "$CID" sh -c 'test ! -e /var/lib/socks5-manager && test ! -L /var/lib/socks5-manager'
          docker exec "$CID" sh -c 'test ! -e /usr/local/libexec/socks5-manager && test ! -L /usr/local/libexec/socks5-manager'
          docker exec "$CID" sh -c 'test ! -e /etc/systemd/system/socks5-manager.service && test ! -L /etc/systemd/system/socks5-manager.service'

          if docker exec "$CID" id socks5proxy >/dev/null 2>&1; then
            echo "account survived" >&2; exit 1; fi
          if docker exec "$CID" getent group socks5proxy >/dev/null 2>&1; then
            echo "group survived" >&2; exit 1; fi
          # a system package the installer added must still be installed.
          # `command` is a shell BUILTIN -- docker exec without sh -c tries to
          # execve("command") and dies with 127, which is exactly what killed
          # this check on its first ever execution.
          docker exec "$CID" sh -c 'command -v git >/dev/null'
